# GameTest asset manifest (gamekit). One entry per asset; check with `gamekit validate`.
# Built from the code at v0.24.0: src/art/pixel_art.gd (197 sprites, grouped here by
# asset with their animation frames), Sfx (28 sounds), Tracks.ALL (9 tracks), and the
# visuals drawn by code today (floors, bullets, effects, UI). Sizes and frames match
# what the game has now; entries marked "size inferred" are estimates.
# Not listed: the unused "ghost" sprite (ghosts were replaced by revives in v0.15).
# Particles, the minimap background, teammate arrows, level pips and the text font stay code-drawn (pixel_font is optional).
# Field reference: gamekit's templates/assets.yaml.
game: GameTest
output: assets
palette: palette.hex

